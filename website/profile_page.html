<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
</head>
<body>

    <!-- Account Information Header-->
     <div> 
        <h1>Account Information</h1>
     </div>

    <!-- User Profile Picture and Username -->
    <div>
        <img src="placeholder_profile.png" alt="Profile Picture">
        <p>Username: TemplateUser</p>
        <button type="button">Change</button>
    </div>

    <!-- Email and Change Button -->
    <div>
        <p>Email: templateuser@example.com <button type="button">Change</button></p>
    </div>

    <!-- Account Created: -->
     <div> 
        <p>Account Created On: MM/DD/YYYY</p>
     </div>


    <!-- Account Actions -->
    <div>
        <button type="button">Change Password</button>
        <button type="button">Log Out</button>
        <button type="button">Delete Account</button>
    </div>

    <!-- Saved Section -->
    <section>
        <h2>Saved</h2>
        <div>
            <img src="placeholder_saved1.png" alt="Saved item 1">
            <img src="placeholder_saved2.png" alt="Saved item 2">
            <img src="placeholder_saved3.png" alt="Saved item 3">
        </div>
        <button type="button">See More</button>
    </section>

    <!-- Reviews Section -->
    <section>
        <h2>Reviews</h2>
        <div>
            <img src="placeholder_review1.png" alt="Review item 1">
            <img src="placeholder_review2.png" alt="Review item 2">
            <img src="placeholder_review3.png" alt="Review item 3">
        </div>
        <button type="button">See More</button>
    </section>

    <!-- Liked Section -->
    <section>
        <h2>Liked</h2>
        <div>
            <img src="placeholder_liked1.png" alt="Liked item 1">
            <img src="placeholder_liked2.png" alt="Liked item 2">
            <img src="placeholder_liked3.png" alt="Liked item 3">
        </div>
        <button type="button">See More</button>
    </section>
</body>
</html>
