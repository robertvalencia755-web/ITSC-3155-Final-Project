<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseLens - Log In</title>
    <script type="module" src="/assets/js/auth.js"></script>
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <link rel="stylesheet" href="/assets/css/header.css">
</head>

<body>

    <header data-site-header>
        <a href="../../index.html">
            <img src="../../assets/images/FInal CourseLen Logo Design.png" alt="CourseLens Logo">
        </a>
        <nav>
            <a href="../../index.html">Home</a>
            <a href="/pages/catalogue.html">Catalogue</a>
            <a href="../profile.html">Profile</a>
            <a href="logIn_page.html" class="active">Log In</a>
        </nav>
    </header>

    <div class="auth-card">

        <h1>Log In</h1>
        <p class="auth-subtitle">Welcome back! Please enter your details.</p>

        <!-- Email/Username and Password submission boxes + button-->
        <form id="login-form" novalidate>

            <p id="form-error" class="form-error" role="alert" hidden></p>

            <div class="form-group">
                <label for="login">Email or Username</label>
                <input type="text" id="login" name="login" placeholder="you@example.com or your username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit">Log In</button>

            <div class="auth-divider">or</div>

            <button type="button" class="btn-secondary">UNCC Log In</button>

        </form>

        <div class="auth-footer">
            <p>No account? <a href="signup_page.html">Sign Up</a></p>
        </div>

    </div>

    <script type="module" src="/assets/js/header.js"></script>
</body>
</html>
