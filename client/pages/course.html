<!DOCTYPE html>
<html>
<head>
    <title>CourseLens - Course Page</title>
    <link rel="stylesheet" href="css/course.css">
</head>

<body>


    <header>
        <img src="images/FInal CourseLen Logo Design.png" alt="CourseLens Logo">

        <nav>
            <a href="../index.html">Home</a>
            <a href="#">Catalogue</a>
            <a href="#">Profile</a>
        </nav>
    </header>


    <main>

        <section class="course-info">
            <p class="department">Student Major</p>

            <h1>Course Name</h1>
            <p class="course-code">Course Code</p>
        </section>


        <section class="rating-section">

            <h2>Course Overview</h2>

            <div class="rating">
                <h3>3 / 5</h3>
                <p>Overall Course Rating</p>
                <p>Based on student reviews</p>
            </div>

        </section>


        <section class="professor-section">

            <h2>Professor Information</h2>

            <p><strong>Professor:</strong> Professor Name</p>

            <p><strong>Department:</strong> Major</p>

        </section>


        <section class="reviews-section">

            <div class="reviews-heading">
                <h2>Student Reviews</h2>

                <button>Write a Review</button>
            </div>

            <div class="review">
                <h3>Student Review</h3>
                <p>Reviews for this course will appear here.</p>
            </div>

        </section>

    </main>

</body>
</html>
