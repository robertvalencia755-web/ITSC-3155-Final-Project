<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
</head>

<body>

    <!-- Sign up Title-->
    <div>
        <h1>Create an Account</h1>
    </div>


    <!-- Email and Password submission boxes + button-->
    <form action="/submit-data" method="POST">
        
        <!-- Enter an email -->
        <div>
            <label for="email">email:</label>
            <input type="text" if="email" name="email" placeholder="" required>
        </div>
        
        <!-- Enter a username -->
        <div>
            <label for="username">username:</label>
            <input type="text" id="username" name="username" placeholder="" required>
        </div>
        
        <!-- Enter a password -->
        <div>
            <label for="password">password:</label>
            <input type="text" id="password" name="password" placeholder="" required>
        </div>

        <!-- Verify password -->
        <div>
            <label for="verify password">verify password:</label>
            <input type="text" id="verify_password" name="verfy_password" placeholder="" required>
        </div>
        
    </form>

    <div>
        
        <button>Create Account</button>

    </div>
    

    



</body>
