
<!DOCTYPE html>
<html>
<head>
    <title>CourseLens - Course Page</title>
    <link rel="stylesheet" href="/assets/css/course.css">
    <link rel="stylesheet" href="/assets/css/header.css">
</head>

<body>

    <header data-site-header>
        <img src="../assets/images/FInal CourseLen Logo Design.png" alt="CourseLens Logo">

        <nav>
            <a href="../index.html">Home</a>
            <a href="/pages/catalogue.html">Catalogue</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <main>

        <section class="course-info">
            <div>
                <p class="department" id="course-department">Loading department...</p>
                <h1 id="course-name">Loading course...</h1>
                <p class="course-code" id="course-code"></p>
            </div>

            <button id="save-course" class="save-button" aria-pressed="false">
                ☆ Save Course
            </button>
        </section>

        <div class="course-layout">

            <section class="rating-section">
                <div class="section-heading">
                    <h2>Course Statistics</h2>
                    <p>Student feedback at a glance</p>
                </div>

                <div id="course-stats"></div>
            </section>

            <div class="right-column">

                <section class="professor-section">
                    <h2>Professor Information</h2>

                    <div id="professor-list">
                        <p>Loading professors...</p>
                    </div>
                </section>

                <section class="reviews-section">
                    <div class="reviews-heading">
                        <div>
                            <h2>Student Reviews</h2>
                            <p>What students are saying</p>
                        </div>

                        <button class="review-button">Write a Review</button>
                    </div>

                    <div id="reviews-list">
                        <p>Loading reviews...</p>
                    </div>
                </section>

            </div>

        </div>

    </main>

    <script type="module" src="/assets/js/header.js"></script>
    <script type="module" src="/assets/js/course-stats.jsx"></script>
    <script type="module" src="/assets/js/course-page.js"></script>

</body>
</html>
